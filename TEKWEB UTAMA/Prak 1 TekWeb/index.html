<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantin UAD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Kantin UAD</div>
        <nav class="nav-menu">
            <a href="#">Beranda</a>
            <a href="#">Menu</a>
            <a href="#">Tentang</a>
            <a href="#">Kontak</a>
        </nav>
    </header>

    <div class="container">
        <h2>Menu Pilihan Kantin</h2>
        <div class="grid-menu">
            <div class="card">
                <img src="nasi goreng.jpeg" alt="menu">
                <div class="card-body">
                    <h3>Nasi Goreng Special</h3>
                    <p class="harga">Rp 15.000</p>
                    <button>Pesan</button>
                </div>
            </div>
            <div class="card">
                <img src="mi ayam bakso.jpeg" alt="menu">
                <div class="card-body">
                    <h3>Mie Ayam Bakso</h3>
                    <p class="harga">Rp 13.000</p>
                    <button>Pesan</button>
                </div>
            </div>
            <div class="card">
                <img src="ayam geprek.jpeg" alt="menu">
                <div class="card-body">
                    <h3>Ayam Geprek</h3>
                    <p class="harga">Rp 16.000</p>
                    <button>Pesan</button>
                </div>
            </div>
            <div class="card">
                <img src="sate ayam.jpeg" alt="menu">
                <div class="card-body">
                    <h3>Sate Ayam</h3>
                    <p class="harga">Rp 20.000</p>
                    <button>Pesan</button>
                </div>
            </div>
            <div class="card">
                <img src="es teh.jpeg" alt="menu">
                <div class="card-body">
                    <h3>Es Teh Manis</h3>
                    <p class="harga">Rp 4.000</p>
                    <button>Pesan</button>
                </div>
            </div>
            <div class="card">
                <img src="jus alpukat.jpeg" alt="menu">
                <div class="card-body">
                    <h3>Jus Alpukat</h3>
                    <p class="harga">Rp 8.000</p>
                    <button>Pesan</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Kantin UAD</p>
    </footer>

</body>
</html>
